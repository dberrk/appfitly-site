<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitly — AI Konsey koçun</title>
<meta name="description" content="Fitly: antrenman, beslenme ve toparlanmayı üç uzmanlı AI Konsey'le yöneten fitness koçu. Yakında App Store'da.">
<style>
  body { margin:0; background:#060709; color:#F5F6F8; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { text-align:center; padding:48px 28px; }
  .tile { width:72px; height:72px; border-radius:20px; background:#171B0D; color:#6EE088;
          font-size:36px; font-weight:700; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  h1 { font-size:30px; font-weight:700; letter-spacing:-0.4px; margin:0 0 10px; }
  p  { font-size:15px; line-height:1.6; color:rgba(235,237,245,.55); margin:0 auto; max-width:340px; }
  .pill { display:inline-block; margin-top:22px; padding:9px 18px; border-radius:20px;
          background:rgba(110,224,136,.12); border:1px solid rgba(110,224,136,.3);
          color:#6EE088; font-size:13px; font-weight:700; }
  footer { position:fixed; bottom:20px; left:0; right:0; text-align:center;
           font-size:12px; color:rgba(235,237,245,.35); }
</style>
</head>
<body>
  <div class="card">
    <div class="tile">F</div>
    <h1>fitly</h1>
    <p>Antrenmanını, beslenmeni ve toparlanmanı üç uzmanlı AI Konsey'le yöneten koçun.</p>
    <span class="pill">Yakında App Store'da</span>
  </div>
  <footer>Fitly · AI Konsey koçun</footer>
</body>
</html>
