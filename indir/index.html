<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fitly</title>
<link rel="icon" href="/assets/logo.png">
<!--
  Fitly indirme köprüsü — Instagram/Facebook in-app browser'ından App Store'a.

  NEDEN VAR: Instagram linkleri kendi WKWebView'ında açıyor. apps.apple.com o
  pencerede App Store uygulamasına devredilemiyor, kullanıcı ölü bir sayfada
  kalıyor. Düz 302 yönlendirme ÇÖZMEZ: aynı WebView'ın içinde kalır, sadece bir
  hop ekler, üstelik Instagram çok adımlı yönlendirmeleri spam sayabiliyor.

  ÇALIŞAN KAÇIŞ (shalanah/inapp-debugger test matrisi, 2026): Instagram iOS
  x-safari-https şemasını YALNIZCA window.open ile kabul ediyor. location.href
  ile aynı şema engelleniyor, ve her iki durumda da kaçış bir KULLANICI
  DOKUNUŞUNA bağlı olmak zorunda. Bu yüzden in-app browser'da otomatik
  yönlendirme yok, büyük bir buton var.

  MAĞAZA URL'İ: ülke segmenti (/tr/) BİLEREK yok. O segment dili değil
  STOREFRONT'u seçer; Alman bir kullanıcıyı /tr/'ye göndermek onu satın
  alamayacağı bir vitrine sokar. Segmentsiz biçimde Apple ziyaretçiyi kendi
  vitrinine yönlendirir. ?l= yalnız web sayfasının dilini seçer; App Store
  uygulamasına devredildiğinde zaten cihaz dili geçerli olur.

  ATIF (ADR-016 §4): ?c=<creator> → ct=<creator>. App Analytics kampanya
  raporu bunu okur. SDK yok, yeni vendor yok, tracking etiketi None kalır.
-->
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#060709; color:#F5F6F8;
         font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px; box-sizing:border-box; }
  .card { text-align:center; max-width:340px; }
  .tile { width:56px; height:56px; border-radius:16px; background:#171B0D; color:#6EE088;
          font-size:28px; font-weight:700; display:flex; align-items:center;
          justify-content:center; margin:0 auto 16px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 8px; }
  p  { font-size:14px; line-height:1.6; color:rgba(235,237,245,.55); margin:0; }
  .btn { display:block; margin:22px 0 0; padding:15px 22px; border-radius:999px;
         background:#6EE088; color:#0B0C0F; font-size:16px; font-weight:700;
         text-decoration:none; }
  .hint { font-size:12.5px; line-height:1.6; color:rgba(235,237,245,.38); margin-top:14px; }
  .alt { display:inline-block; margin-top:16px; font-size:14px; font-weight:600;
         color:#6EE088; background:none; border:0; border-bottom:1px solid rgba(110,224,136,.35);
         padding:0 0 2px; font-family:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="tile">F</div>
    <!-- Metin ve bağlantı JS'siz de doğru: varsayılan Türkçe, href tam. -->
    <h1 id="h">Fitly'yi indir</h1>
    <p id="sub">App Store'da aç, kurulum bir dokunuş.</p>
    <a id="btn" class="btn" href="https://apps.apple.com/app/id6790693710?l=tr">App Store'da aç</a>
    <button id="alt" class="alt" hidden></button>
    <p id="hint" class="hint" hidden></p>
  </div>
<script>
(function () {
  var APP_ID = "6790693710";
  // Sağlayıcı token'ı (ASC → App Analytics kampanya linkleri). Owner ASC'den
  // üretip buraya koyunca kampanya raporu creator kırılımı verir; boşken link
  // yine çalışır, sadece Apple tarafı atıf yapmaz.
  var PROVIDER_TOKEN = "";

  var COPY = {
    tr:{h:"Fitly'yi indir",s:"App Store'da aç, kurulum bir dokunuş.",b:"App Store'da aç",
        a:"Safari'de aç",
        n:"App Store açılmadıysa “Safari'de aç”a dokun, ya da sağ üstteki ••• menüsünü kullan.",
        o:"Fitly şu an yalnızca iPhone için. Bu sayfayı iPhone'undan aç."},
    en:{h:"Download Fitly",s:"Open it in the App Store, one tap to install.",b:"Open in the App Store",
        a:"Open in Safari",
        n:"If the App Store did not open, tap “Open in Safari”, or use the ••• menu at the top right.",
        o:"Fitly is iPhone only for now. Open this page on your iPhone."},
    de:{h:"Fitly laden",s:"Im App Store öffnen, Installation mit einem Tipp.",b:"Im App Store öffnen",
        a:"In Safari öffnen",
        n:"Wenn der App Store nicht geöffnet wurde, tippe auf „In Safari öffnen“ oder nutze das Menü ••• oben rechts.",
        o:"Fitly gibt es derzeit nur für iPhone. Öffne diese Seite auf deinem iPhone."},
    es:{h:"Descarga Fitly",s:"Ábrelo en el App Store, se instala con un toque.",b:"Abrir en el App Store",
        a:"Abrir en Safari",
        n:"Si el App Store no se abrió, toca “Abrir en Safari” o usa el menú ••• arriba a la derecha.",
        o:"Por ahora Fitly solo está disponible para iPhone. Abre esta página en tu iPhone."},
    fr:{h:"Télécharger Fitly",s:"Ouvrez-le dans l'App Store, installation en un geste.",b:"Ouvrir dans l'App Store",
        a:"Ouvrir dans Safari",
        n:"Si l'App Store ne s'est pas ouvert, touchez « Ouvrir dans Safari » ou utilisez le menu ••• en haut à droite.",
        o:"Fitly est disponible uniquement sur iPhone pour le moment. Ouvrez cette page sur votre iPhone."},
    it:{h:"Scarica Fitly",s:"Aprilo nell'App Store, si installa con un tocco.",b:"Apri nell'App Store",
        a:"Apri in Safari",
        n:"Se l'App Store non si è aperto, tocca “Apri in Safari” oppure usa il menu ••• in alto a destra.",
        o:"Per ora Fitly è disponibile solo per iPhone. Apri questa pagina dal tuo iPhone."},
    ja:{h:"Fitly をダウンロード",s:"App Store で開くと、ワンタップでインストールできます。",b:"App Store で開く",
        a:"Safariで開く",
        n:"App Store が開かない場合は「Safariで開く」をタップするか、右上の ••• メニューをお使いください。",
        o:"Fitly は現在 iPhone のみ対応です。iPhone でこのページを開いてください。"},
    ko:{h:"Fitly 다운로드",s:"App Store에서 열면 한 번의 탭으로 설치됩니다.",b:"App Store에서 열기",
        a:"Safari로 열기",
        n:"App Store가 열리지 않으면 “Safari로 열기”를 누르거나 오른쪽 위 ••• 메뉴를 사용하세요.",
        o:"Fitly는 현재 iPhone에서만 사용할 수 있습니다. iPhone에서 이 페이지를 열어 주세요."},
    "pt-BR":{h:"Baixar o Fitly",s:"Abra na App Store, instala com um toque.",b:"Abrir na App Store",
        a:"Abrir no Safari",
        n:"Se a App Store não abriu, toque em “Abrir no Safari” ou use o menu ••• no canto superior direito.",
        o:"No momento o Fitly está disponível apenas para iPhone. Abra esta página no seu iPhone."},
    ru:{h:"Скачать Fitly",s:"Откройте в App Store, установка в одно касание.",b:"Открыть в App Store",
        a:"Открыть в Safari",
        n:"Если App Store не открылся, нажмите «Открыть в Safari» или используйте меню ••• в правом верхнем углу.",
        o:"Сейчас Fitly доступен только для iPhone. Откройте эту страницу на iPhone."},
    "zh-Hans":{h:"下载 Fitly",s:"在 App Store 中打开，一键安装。",b:"在 App Store 中打开",
        a:"在 Safari 中打开",
        n:"如果 App Store 没有打开，请点按“在 Safari 中打开”，或使用右上角的 ••• 菜单。",
        o:"Fitly 目前仅支持 iPhone。请在 iPhone 上打开此页面。"},
    ar:{h:"تنزيل Fitly",s:"افتحه في App Store، والتثبيت بلمسة واحدة.",b:"الفتح في App Store",
        a:"الفتح في Safari",
        n:"إذا لم يفتح App Store، المس “الفتح في Safari” أو استخدم قائمة ••• في الأعلى.",
        o:"‏Fitly متاح حاليًا على iPhone فقط. افتح هذه الصفحة على iPhone."}
  };

  var params = new URLSearchParams(location.search);

  // Dil: ?lang= zorlaması → tarayıcı tercihleri → tr. Sitenin kendi klasör
  // adlarıyla aynı kodlar kullanılıyor (pt-BR, zh-Hans).
  function pickLang() {
    var forced = params.get("lang");
    var prefs = (forced ? [forced] : []).concat(
      navigator.languages && navigator.languages.length
        ? Array.prototype.slice.call(navigator.languages)
        : [navigator.language || "tr"]);
    for (var i = 0; i < prefs.length; i++) {
      var tag = String(prefs[i]);
      if (COPY[tag]) return tag;                                  // pt-BR
      var base = tag.toLowerCase().split("-")[0];
      if (base === "pt") return "pt-BR";
      if (base === "zh") return "zh-Hans";
      for (var key in COPY) if (key.toLowerCase() === base) return key;
    }
    return "tr";
  }

  var lang = pickLang();
  var t = COPY[lang];
  document.documentElement.lang = lang;
  if (lang === "ar") document.documentElement.dir = "rtl";

  // Mağaza URL'i: ülke segmenti YOK (yukarıdaki nota bak). Apple ziyaretçiyi
  // kendi vitrinine yönlendirir; ?l yalnız web sayfasının dilini seçer.
  var store = "https://apps.apple.com/app/id" + APP_ID + "?l=" + encodeURIComponent(lang);
  var creator = (params.get("c") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
  if (creator) {
    store += "&ct=" + encodeURIComponent(creator);
    if (PROVIDER_TOKEN) store += "&pt=" + encodeURIComponent(PROVIDER_TOKEN);
  }

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|TikTok|Snapchat|Pinterest/i.test(ua);

  var h = document.getElementById("h"), sub = document.getElementById("sub"),
      btn = document.getElementById("btn"), alt = document.getElementById("alt"),
      hint = document.getElementById("hint");

  h.textContent = t.h;
  sub.textContent = t.s;
  btn.textContent = t.b;
  btn.href = store;                 // birincil yol: DÜZ bağlantı, JS karışmaz

  if (!isIOS) {
    // Android/masaüstü: dürüst mesaj, satın alınamayacak vitrine yollamak yok.
    sub.textContent = t.o;
    return;
  }

  if (!inApp) return;               // gerçek tarayıcıda butondan fazlası gerekmiyor

  // In-app browser: Safari kaçışı AYRI ve açıkça etiketli İKİNCİ seçenek.
  // Denemek kullanıcının kararı; boş sekme açılırsa bunu kendi seçtiği için
  // görür ve birincil buton hâlâ arkasında durur. Boş sekmeyi kapatmayı da
  // deneriz (best-effort: bazı in-app browser'lar buna izin vermez).
  alt.textContent = t.a;
  alt.hidden = false;
  hint.textContent = t.n;
  hint.hidden = false;

  alt.addEventListener("click", function () {
    var popup = null;
    try { popup = window.open("x-safari-" + store, "_blank"); } catch (err) { popup = null; }
    if (!popup) return;
    setTimeout(function () {
      try { if (popup && !popup.closed) popup.close(); } catch (err) {}
    }, 1500);
  });
})();
</script>
</body>
</html>
