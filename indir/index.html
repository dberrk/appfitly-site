<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fitly</title>
<link rel="icon" href="/assets/logo.png">
<!--
  Fitly indirme köprüsü.

  CANLI ÖLÇÜM (owner, iPhone + Instagram, 2026-08-05). İki otomatik yol da
  ÖLÜ çıktı, ikisi de bu sayfada denendi ve ikisi de başarısız oldu:

    1. Düz <a href="https://apps.apple.com/...">  → hiçbir tepki yok.
       Apple bu adresi iOS'ta itms-appss:// şemasına yönlendiriyor ve
       Instagram'ın WKWebView'ı o şemayı devredemiyor, sessizce düşüyor.
    2. window.open("x-safari-https://...")        → beyaz ekran, sonra geri.
       Şema açılamıyor; window.open yine de bir Window döndürüyor, yani
       dönüş değeri başarıyı ÖLÇMÜYOR. (İlk sürüm bu değere bakıp
       e.preventDefault() çağırdığı için buton hiçbir şey yapmıyordu.)

  Bu yüzden sayfa artık HİÇBİR otomatik kaçış denemiyor. In-app browser'da
  GARANTİLİ tek yol öne alındı: ••• menüsünden sistem tarayıcısında açmak.
  Diğer seçenekler altında, hepsi DÜZ ANCHOR olarak duruyor.

  İKİ SERT KURAL (ikisi de canlıda ihlal edildiği için yazılı):
    · JS hiçbir koşulda navigasyonu iptal etmez. Tek bir click dinleyicisi
      yok; window.open hiç kullanılmıyor.
    · Sayfanın okunabilirliği JS'e bağlı değil. Metin ve çalışan bağlantı
      HTML'de; JS yalnız dili değiştirir ve in-app bölümünü açar.

  MAĞAZA URL'İ: ülke segmenti (/tr/) bilerek yok. O segment dili değil
  STOREFRONT'u seçer ve Alman bir ziyaretçiyi satın alamayacağı vitrine
  sokar. ?l= yalnız web sayfasının dilini seçer.

  ATIF (ADR-016 §4): ?c=<creator> → ct=<creator>. SDK yok, vendor yok.
-->
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#060709; color:#F5F6F8;
         font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px; box-sizing:border-box; }
  .card { text-align:center; max-width:340px; width:100%; }
  .tile { width:56px; height:56px; border-radius:16px; background:#171B0D; color:#6EE088;
          font-size:28px; font-weight:700; display:flex; align-items:center;
          justify-content:center; margin:0 auto 16px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 8px; }
  p  { font-size:14px; line-height:1.6; color:rgba(235,237,245,.55); margin:0; }
  .btn { display:block; margin:22px 0 0; padding:15px 22px; border-radius:999px;
         background:#6EE088; color:#0B0C0F; font-size:16px; font-weight:700;
         text-decoration:none; }
  /* In-app browser yönergesi: garantili yol, o yüzden görsel olarak birincil. */
  .steps { margin:22px 0 0; padding:16px 18px; border-radius:16px;
           background:rgba(110,224,136,.07); border:1px solid rgba(110,224,136,.28);
           text-align:start; }
  .steps b { display:block; font-size:14.5px; margin-bottom:6px; color:#F5F6F8; }
  .steps p { font-size:13.5px; line-height:1.65; }
  .dots { display:inline-block; padding:1px 7px; border-radius:6px;
          background:rgba(255,255,255,.12); font-weight:700; letter-spacing:1px; }
  .alt { display:inline-block; margin:8px 5px 0; font-size:13.5px; font-weight:600;
         color:rgba(110,224,136,.85); background:none; border:0;
         border-bottom:1px solid rgba(110,224,136,.3); padding:0 0 2px;
         font-family:inherit; cursor:pointer; }
  .fb-lead { margin-top:20px; font-size:13px; }
  .hint { font-size:12.5px; line-height:1.6; color:rgba(235,237,245,.38); margin-top:16px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="tile">F</div>
    <!-- JS'siz de doğru ve çalışır: varsayılan Türkçe, href tam. -->
    <h1 id="h">Fitly'yi indir</h1>
    <p id="sub">App Store'da aç, kurulum bir dokunuş.</p>


    <a id="btn" class="btn" href="https://apps.apple.com/app/id6790693710?l=tr">App Store'da aç</a>

    <!-- Düz anchor, JS dokunmuyor. Instagram bu şemayı sisteme devrederse
         doğrudan App Store açılır; devretmezse hiçbir şey olmaz ve yukarıdaki
         yönerge zaten ekranda durmaya devam eder. -->
    <div id="fallbacks" hidden>
      <p id="fbLead" class="fb-lead"></p>
      <button id="tryChrome" class="alt"></button>
      <button id="tryFirefox" class="alt"></button>
      <button id="tryEdge" class="alt"></button>
      <p id="fbManual" class="hint"></p>
    </div>
  </div>
<script>
(function () {
  var APP_ID = "6790693710";
  // ASC → App Analytics kampanya linklerinin sağlayıcı token'ı. Boşken link
  // yine çalışır, sadece Apple tarafı creator kırılımı vermez.
  var PROVIDER_TOKEN = "";

  var COPY = {
    tr:{h:"Fitly'yi indir",s:"App Store'da aç, kurulum bir dokunuş.",b:"App Store'da aç",
        fl:"Açılmadıysa şu tarayıcılardan biriyle dene:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Hiçbiri olmadıysa sağ üstteki ••• menüsünden “Safari'de aç”ı seç, sayfa Safari'de açılınca buton çalışır.",
        o:"Fitly şu an yalnızca iPhone için. Bu sayfayı iPhone'undan aç."},
    en:{h:"Download Fitly",s:"Open it in the App Store, one tap to install.",b:"Open in the App Store",
        fl:"If it did not open, try one of these browsers:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"If none of them work, use the ••• menu at the top right and choose “Open in Safari”. The button works once the page is in Safari.",
        o:"Fitly is iPhone only for now. Open this page on your iPhone."},
    de:{h:"Fitly laden",s:"Im App Store öffnen, Installation mit einem Tipp.",b:"Im App Store öffnen",
        fl:"Falls es nicht geöffnet wurde, versuche einen dieser Browser:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Wenn nichts davon klappt, wähle im Menü ••• oben rechts „In Safari öffnen“. In Safari funktioniert die Schaltfläche.",
        o:"Fitly gibt es derzeit nur für iPhone. Öffne diese Seite auf deinem iPhone."},
    es:{h:"Descarga Fitly",s:"Ábrelo en el App Store, se instala con un toque.",b:"Abrir en el App Store",
        fl:"Si no se abrió, prueba con uno de estos navegadores:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Si ninguno funciona, usa el menú ••• arriba a la derecha y elige “Abrir en Safari”. En Safari el botón funciona.",
        o:"Por ahora Fitly solo está disponible para iPhone. Abre esta página en tu iPhone."},
    fr:{h:"Télécharger Fitly",s:"Ouvrez-le dans l'App Store, installation en un geste.",b:"Ouvrir dans l'App Store",
        fl:"Si rien ne s'est ouvert, essayez l'un de ces navigateurs :",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Si aucun ne fonctionne, utilisez le menu ••• en haut à droite et choisissez « Ouvrir dans Safari ». Le bouton fonctionne dans Safari.",
        o:"Fitly est disponible uniquement sur iPhone pour le moment. Ouvrez cette page sur votre iPhone."},
    it:{h:"Scarica Fitly",s:"Aprilo nell'App Store, si installa con un tocco.",b:"Apri nell'App Store",
        fl:"Se non si è aperto, prova con uno di questi browser:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Se nessuno funziona, usa il menu ••• in alto a destra e scegli “Apri in Safari”. In Safari il pulsante funziona.",
        o:"Per ora Fitly è disponibile solo per iPhone. Apri questa pagina dal tuo iPhone."},
    ja:{h:"Fitly をダウンロード",s:"App Store で開くと、ワンタップでインストールできます。",b:"App Store で開く",
        fl:"開かない場合は、次のブラウザで試してください:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"どれも開かない場合は、右上の ••• メニューから「Safariで開く」を選んでください。Safari ではボタンが機能します。",
        o:"Fitly は現在 iPhone のみ対応です。iPhone でこのページを開いてください。"},
    ko:{h:"Fitly 다운로드",s:"App Store에서 열면 한 번의 탭으로 설치됩니다.",b:"App Store에서 열기",
        fl:"열리지 않으면 다음 브라우저로 시도해 보세요:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"모두 안 되면 오른쪽 위 ••• 메뉴에서 “Safari로 열기”를 선택하세요. Safari에서는 버튼이 작동합니다.",
        o:"Fitly는 현재 iPhone에서만 사용할 수 있습니다. iPhone에서 이 페이지를 열어 주세요."},
    "pt-BR":{h:"Baixar o Fitly",s:"Abra na App Store, instala com um toque.",b:"Abrir na App Store",
        fl:"Se não abriu, tente um destes navegadores:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Se nenhum funcionar, use o menu ••• no canto superior direito e escolha “Abrir no Safari”. No Safari o botão funciona.",
        o:"No momento o Fitly está disponível apenas para iPhone. Abra esta página no seu iPhone."},
    ru:{h:"Скачать Fitly",s:"Откройте в App Store, установка в одно касание.",b:"Открыть в App Store",
        fl:"Если не открылось, попробуйте один из этих браузеров:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"Если ничего не помогло, откройте меню ••• в правом верхнем углу и выберите «Открыть в Safari». В Safari кнопка работает.",
        o:"Сейчас Fitly доступен только для iPhone. Откройте эту страницу на iPhone."},
    "zh-Hans":{h:"下载 Fitly",s:"在 App Store 中打开，一键安装。",b:"在 App Store 中打开",
        fl:"如果没有打开，请尝试以下浏览器:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"如果都不行，请点按右上角的 ••• 菜单，选择“在 Safari 中打开”。在 Safari 中按钮即可正常使用。",
        o:"Fitly 目前仅支持 iPhone。请在 iPhone 上打开此页面。"},
    ar:{h:"تنزيل Fitly",s:"افتحه في App Store، والتثبيت بلمسة واحدة.",b:"الفتح في App Store",
        fl:"إذا لم يفتح، جرّب أحد هذه المتصفحات:",
        fc:"Chrome",
        ff:"Firefox",
        fe:"Edge",
        fm:"إذا لم ينجح أي منها، استخدم قائمة ••• في الأعلى واختر “الفتح في Safari”. يعمل الزر داخل Safari.",
        o:"‏Fitly متاح حاليًا على iPhone فقط. افتح هذه الصفحة على iPhone."}
  };

  var params = new URLSearchParams(location.search);

  function pickLang() {
    var forced = params.get("lang");
    var prefs = (forced ? [forced] : []).concat(
      navigator.languages && navigator.languages.length
        ? Array.prototype.slice.call(navigator.languages)
        : [navigator.language || "tr"]);
    for (var i = 0; i < prefs.length; i++) {
      var tag = String(prefs[i]);
      if (COPY[tag]) return tag;
      var base = tag.toLowerCase().split("-")[0];
      if (base === "pt") return "pt-BR";
      if (base === "zh") return "zh-Hans";
      for (var key in COPY) if (key.toLowerCase() === base) return key;
    }
    return "tr";
  }

  var lang = pickLang();
  var t = COPY[lang];
  document.documentElement.lang = lang;
  if (lang === "ar") document.documentElement.dir = "rtl";

  var query = "?l=" + encodeURIComponent(lang);
  var creator = (params.get("c") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
  if (creator) {
    query += "&ct=" + encodeURIComponent(creator);
    if (PROVIDER_TOKEN) query += "&pt=" + encodeURIComponent(PROVIDER_TOKEN);
  }
  var store = "https://apps.apple.com/app/id" + APP_ID + query;
  // ARAŞTIRMA SONUCU (2026-08-05, owner cihazında ölçüldü):
  //   · https://apps.apple.com  → Apple iOS'ta itms-appss:// şemasına
  //     yönlendiriyor, Instagram'ın WebView'ı devredemiyor. ÖLÜ.
  //   · x-safari-https://       → Apple'ın BELGELEMEDİĞİ bir şema, iOS
  //     sürümüne göre değişiyor (iOS 16'da hiç yok). Safari'nin güvenilir
  //     bir URL şeması YOK. ÖLÜ.
  //   · googlechromes://        → ÇALIŞTI (location.href + dokunuş ile).
  // Chrome'un çalışması, Instagram'ın location.href üzerinden harici şema
  // AÇTIĞINI kanıtlıyor. itms-apps:// aynı yoldan hiç denenmemişti (yalnız
  // düz anchor olarak denenmişti, o da engellenen yol). Birincil buton artık
  // o boşluğu kullanıyor: başarılıysa App Store DOĞRUDAN açılır, tarayıcı
  // sıçraması yok ve hiçbir tarayıcının kurulu olması gerekmez.
  var storeScheme = "itms-apps://apps.apple.com/app/id" + APP_ID + query;
  var bare = store.replace(/^https:\/\//, "");
  var BROWSERS = [
    { key: "fc", url: "googlechromes://" + bare },              // ölçüldü: çalışıyor
    { key: "ff", url: "firefox://open-url?url=" + encodeURIComponent(store) },
    { key: "fe", url: "microsoft-edge-https://" + bare }
  ];

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|TikTok|Snapchat|Pinterest/i.test(ua);

  var h = document.getElementById("h"), sub = document.getElementById("sub"),
      btn = document.getElementById("btn"), alt = document.getElementById("alt"),
      fallbacks = document.getElementById("fallbacks"),
      fbLead = document.getElementById("fbLead"),
      fbManual = document.getElementById("fbManual"),
      tryChrome = document.getElementById("tryChrome"),
      tryFirefox = document.getElementById("tryFirefox"),
      tryEdge = document.getElementById("tryEdge");

  h.textContent = t.h;
  sub.textContent = t.s;
  btn.textContent = t.b;
  btn.href = store;          // düz anchor, üzerinde hiçbir dinleyici yok

  if (!isIOS) {
    // Android/masaüstü: dürüst mesaj, satın alınamayacak vitrine yollamak yok.
    sub.textContent = t.o;
    return;
  }

  if (!inApp) return;        // gerçek tarayıcı: tek buton yeter

  // In-app browser: garantili yol görsel olarak birincil, şema denemesi
  // ikincil. İkisi de pasif; sayfa kullanıcı adına hiçbir şey denemiyor,
  // çünkü denediği iki şey de canlıda ölü çıktı.
  // In-app browser: birincil buton artık https DEĞİL, itms-apps şeması.
  // https bu ortamda ölçülerek ölü bulundu; şemayı denemek en azından bir
  // ihtimal, ve başarısız olursa hiçbir şey olmuyor (beyaz ekran yok,
  // iptal edilen navigasyon yok) çünkü altındaki seçenekler ekranda kalıyor.
  btn.removeAttribute("href");
  btn.setAttribute("role", "button");
  btn.style.cursor = "pointer";
  btn.onclick = function () { location.href = storeScheme; };

  fbLead.textContent = t.fl;
  fbManual.textContent = t.fm;
  fallbacks.hidden = false;
  BROWSERS.forEach(function (b, i) {
    var el = [tryChrome, tryFirefox, tryEdge][i];
    el.textContent = t[b.key];
    el.onclick = function () { location.href = b.url; };
  });
})();
</script>
</body>
</html>
