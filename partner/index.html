<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitly Partner</title>
<meta name="theme-color" content="#060709">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/partner/panel.css?v=20260729b">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><img src="/assets/logo.png" alt=""> <span id="brandTitle">Fitly Partner</span></div>
    <div class="spacer"></div>
    <div class="lang" id="langToggle"></div>
    <button type="button" class="btn btn-ghost btn-sm hidden" id="signOutBtn">Çıkış</button>
  </div>

  <!-- Not configured -->
  <div class="card hidden" id="notConfigured"><div class="msg msg-error" id="notConfiguredMsg"></div></div>

  <!-- Sign in -->
  <section class="auth hidden" id="authView">
    <div class="card">
      <h2 id="signInTitle">Giriş yap</h2>
      <p class="sub" id="signInSub">appfitly.com</p>
      <div class="msg msg-error hidden" id="authError"></div>
      <form id="authForm" novalidate>
        <label class="field"><span id="lblEmail">E-posta</span>
          <input type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span id="lblPassword">Parola</span>
          <input type="password" id="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn" id="signInBtn" style="width:100%">Giriş yap</button>
      </form>
    </div>
  </section>

  <!-- Forced password change -->
  <section class="auth hidden" id="pwView">
    <div class="card">
      <h2 id="pwTitle">Parolanı belirle</h2>
      <p class="sub" id="pwHint"></p>
      <div class="msg msg-error hidden" id="pwError"></div>
      <form id="pwForm" novalidate>
        <label class="field"><span id="lblNewPw">Yeni parola</span>
          <input type="password" id="newPw" autocomplete="new-password" required></label>
        <label class="field"><span id="lblNewPw2">Yeni parola (tekrar)</span>
          <input type="password" id="newPw2" autocomplete="new-password" required></label>
        <button type="submit" class="btn" id="pwBtn" style="width:100%">Parolayı kaydet</button>
      </form>
    </div>
  </section>

  <!-- Dashboard -->
  <section class="hidden" id="dashView">
    <div class="card" id="profileCard">
      <h2 id="profileTitle">Partner bilgilerin</h2>
      <div class="msg msg-error hidden" id="suspendedMsg"></div>
      <div class="facts" id="profileFacts"></div>
      <p class="sub" id="commissionNote" style="margin:12px 0 0"></p>
    </div>

    <div class="totals" id="totals"></div>
    <div class="card">
      <h2 id="earningsTitle">Kazanç</h2>
      <p class="sub" id="estimateNote"></p>
      <div id="earningsBody"><p class="empty" id="loadingText2">Yükleniyor...</p></div>
      <p class="sub" id="maturityNote" style="margin:14px 0 0"></p>
    </div>

    <div class="card">
      <h2 id="codesTitle">Kodların</h2>
      <p class="sub" id="privacyNote"></p>
      <div id="codesBody"><p class="empty" id="loadingText">Yükleniyor...</p></div>
    </div>

    <div class="card">
      <h2 id="accountTitle">Hesap</h2>
      <div class="msg msg-ok hidden" id="accountOk"></div>

      <details id="pwDetails">
        <summary id="changePwSummary">Parolanı değiştir</summary>
        <div class="msg msg-error hidden" id="pwError2"></div>
        <form id="pwForm2" novalidate>
          <label class="field"><span id="lblNewPwA">Yeni parola</span>
            <input type="password" id="newPwA" autocomplete="new-password" required></label>
          <label class="field"><span id="lblNewPwB">Yeni parola (tekrar)</span>
            <input type="password" id="newPwB" autocomplete="new-password" required></label>
          <button type="submit" class="btn btn-sm" id="pwBtn2">Parolayı kaydet</button>
        </form>
      </details>

      <details id="leaveDetails">
        <summary id="leaveSummary">Programdan ayrılma</summary>
        <p class="sub" id="leaveNote"></p>
        <div class="msg msg-error hidden" id="leaveError"></div>
        <div id="leavePendingBox" class="hidden">
          <div class="msg msg-ok" id="leavePendingMsg"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="leaveWithdrawBtn"></button>
        </div>
        <form id="leaveForm" novalidate>
          <label class="field"><span id="lblLeaveReason">Sebep (isteğe bağlı)</span>
            <input type="text" id="leaveReason" maxlength="500"></label>
          <button type="submit" class="btn btn-ghost btn-sm" id="leaveBtn"></button>
        </form>
      </details>

      <p class="sub" style="margin:16px 0 0">
        <a id="termsLink" href="/partner-terms/">Partner sözleşmesi</a>
      </p>
    </div>
  </section>

</div>

<script src="/partner/vendor/supabase.js"></script>
<script src="/partner/config.js?v=20260729b"></script>
<script src="/partner/i18n.js?v=20260729b"></script>
<script src="/partner/panel.js?v=20260729b"></script>
<script>
(function () {
  "use strict";
  var P = window.FitlyPanel, t = P.t, esc = P.escapeHtml;
  var $ = function (id) { return document.getElementById(id); };
  var show = function (el, on) { el.classList.toggle("hidden", !on); };
  // Null-safe: some labels live inside containers that later get re-rendered
  // (loadingText is replaced by the stats table), and the language toggle must
  // keep working after that.
  var txt = function (id, value) { var el = $(id); if (el) el.textContent = value; };

  var state = { stats: null };

  P.mountLangToggle($("langToggle"));

  function paintStatic() {
    document.title = t("panelTitle");
    txt("brandTitle", t("panelTitle"));
    txt("signInTitle", t("signIn"));
    txt("lblEmail", t("email"));
    txt("lblPassword", t("password"));
    txt("signInBtn", t("signIn"));
    txt("signOutBtn", t("signOut"));
    txt("pwTitle", t("changePasswordTitle"));
    txt("pwHint", t("changePasswordHint"));
    txt("lblNewPw", t("newPassword"));
    txt("lblNewPw2", t("newPasswordAgain"));
    txt("pwBtn", t("savePassword"));
    txt("earningsTitle", t("earnings"));
    txt("estimateNote", t("estimateNote"));
    txt("maturityNote", t("maturityNote"));
    txt("loadingText2", t("loading"));
    txt("codesTitle", t("yourCodes"));
    txt("privacyNote", t("privacyNote"));
    txt("loadingText", t("loading"));
    txt("notConfiguredMsg", t("notConfigured"));
    txt("profileTitle", t("profileTitle"));
    txt("commissionNote", t("commissionNote"));
    txt("accountTitle", t("account"));
    txt("changePwSummary", t("changePasswordCta"));
    txt("lblNewPwA", t("newPassword"));
    txt("lblNewPwB", t("newPasswordAgain"));
    txt("pwBtn2", t("savePassword"));
    txt("leaveSummary", t("leaveTitle"));
    txt("leaveNote", t("leaveNote"));
    txt("lblLeaveReason", t("leaveReasonLabel"));
    txt("leaveBtn", t("leaveCta"));
    txt("leaveWithdrawBtn", t("leaveWithdraw"));
    txt("leavePendingMsg", t("leavePending"));
    txt("termsLink", t("termsLink"));
    // The agreement exists in TR and EN only, mirroring the panel's own two
    // languages, so the link follows whichever the partner is reading in.
    $("termsLink").href = P.lang === "tr"
      ? "/partner-sozlesmesi.html"
      : "/en/partner-sozlesmesi.html";
    if (state.stats) {
      renderProfile(state.stats.profile);
      renderStats(state.stats);
      renderEarnings(state.stats);
    }
  }

  /// Amounts are estimates and may legitimately be unknown (the store did not
  /// report the deduction rates), which is rendered as a dash rather than 0 so
  /// a real sale is never shown as having earned nothing.
  function money(amount, currency) {
    if (amount === null || amount === undefined) return "-";
    var value = Number(amount);
    if (!isFinite(value)) return "-";
    try {
      return new Intl.NumberFormat(P.lang === "tr" ? "tr-TR" : "en-US", {
        style: currency ? "currency" : "decimal",
        currency: currency || undefined,
        maximumFractionDigits: 2,
      }).format(value);
    } catch (e) {
      return value.toFixed(2) + (currency ? " " + currency : "");
    }
  }

  function monthLabel(iso) {
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return iso;
    return new Intl.DateTimeFormat(P.lang === "tr" ? "tr-TR" : "en-US",
      { year: "numeric", month: "long", timeZone: "UTC" }).format(d);
  }

  function dateLabel(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "-";
    return new Intl.DateTimeFormat(P.lang === "tr" ? "tr-TR" : "en-US",
      { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" }).format(d);
  }

  /// The partner's own contract facts. `profile` is null when a signed-in
  /// account is not an affiliate: affiliate-stats deliberately answers that with
  /// an empty payload rather than a 403, so the card simply stays hidden.
  function renderProfile(profile) {
    show($("profileCard"), !!profile);
    if (!profile) return;

    var suspended = profile.status === "suspended";
    show($("suspendedMsg"), suspended);
    $("suspendedMsg").textContent = t("suspendedNote");

    // A rate is shown only when we actually have one. Rendering a missing rate
    // as "0%" would tell a partner they earn nothing, which is a very different
    // claim from "not set yet".
    var rate = profile.commissionBps === null || profile.commissionBps === undefined
      ? null
      : (profile.commissionBps / 100);

    $("profileFacts").innerHTML = [
      [t("displayName"), esc(profile.displayName)],
      [t("contactEmail"), esc(profile.contactEmail)],
      [t("accountStatus"), esc(t(suspended ? "statusSuspended" : "statusActive"))],
      [t("commissionRate"), rate === null ? "-" : esc(percent(rate))],
      [t("memberSince"), esc(dateLabel(profile.memberSince))],
    ].map(function (row) {
      return '<div class="fact"><div class="k">' + esc(row[0]) + "</div>" +
             '<div class="v">' + row[1] + "</div></div>";
    }).join("");

    // Asking to leave and having already asked are mutually exclusive states.
    show($("leavePendingBox"), profile.pendingLeave);
    show($("leaveForm"), !profile.pendingLeave);
  }

  function percent(value) {
    try {
      return new Intl.NumberFormat(P.lang === "tr" ? "tr-TR" : "en-US", {
        style: "percent", maximumFractionDigits: 2,
      }).format(value / 100);
    } catch (e) {
      return value + "%";
    }
  }

  function renderEarnings(stats) {
    var rows = (stats && stats.earnings) || [];
    if (!rows.length) {
      $("earningsBody").innerHTML = '<p class="empty">' + esc(t("noEarnings")) + "</p>";
      return;
    }
    $("earningsBody").innerHTML =
      '<div class="table-scroll"><table><thead><tr>' +
        "<th>" + esc(t("month")) + "</th>" +
        '<th class="num">' + esc(t("sales")) + "</th>" +
        '<th class="num">' + esc(t("refunds")) + "</th>" +
        '<th class="num">' + esc(t("pending")) + "</th>" +
        '<th class="num">' + esc(t("payable")) + "</th>" +
        '<th class="num">' + esc(t("paid")) + "</th>" +
        "<th>" + esc(t("payableOn")) + "</th>" +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr>" +
          "<td>" + esc(monthLabel(r.month)) + "</td>" +
          '<td class="num">' + esc(r.sales) + "</td>" +
          '<td class="num">' + esc(r.refunds) + "</td>" +
          '<td class="num">' + esc(money(r.pendingAmount, r.currency)) + "</td>" +
          '<td class="num">' + esc(money(r.payableAmount, r.currency)) +
            (r.unknownAmounts ? ' <span style="opacity:.6">(+' + esc(r.unknownAmounts) +
              " " + esc(t("amountUnknown")) + ")</span>" : "") + "</td>" +
          // money() renders null as a dash, which is what "we have not paid this
          // month yet" must look like. A 0 here would read as "we paid you
          // nothing", and that difference is the whole point of the column.
          '<td class="num">' + esc(money(r.paidAmount, r.currency)) + "</td>" +
          "<td>" + esc(dateLabel(r.payableAt)) + "</td>" +
        "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }
  window.addEventListener("fitly:lang", paintStatic);

  if (!P.isConfigured) { paintStatic(); show($("notConfigured"), true); return; }

  function renderStats(stats) {
    var tot = stats.totals || { claims: 0, conversions: 0, activeConversions: 0 };
    $("totals").innerHTML = [
      ["claims", tot.claims, "claimsHelp"],
      ["conversions", tot.conversions, "conversionsHelp"],
      ["activeConversions", tot.activeConversions, "activeHelp"],
    ].map(function (row) {
      return '<div class="tile"><div class="n">' + esc(row[1]) + "</div>" +
             '<div class="k">' + esc(t(row[0])) + "</div>" +
             '<div class="h">' + esc(t(row[2])) + "</div></div>";
    }).join("");

    var codes = stats.codes || [];
    if (!codes.length) {
      $("codesBody").innerHTML = '<p class="empty">' + esc(t("noCodes")) + "</p>";
      return;
    }
    $("codesBody").innerHTML =
      '<div class="table-scroll"><table><thead><tr>' +
        "<th>" + esc(t("code")) + "</th><th>" + esc(t("status")) + "</th>" +
        '<th class="num">' + esc(t("claims")) + "</th>" +
        '<th class="num">' + esc(t("conversions")) + "</th>" +
        '<th class="num">' + esc(t("activeConversions")) + "</th>" +
        "<th></th>" +
      "</tr></thead><tbody>" +
      codes.map(function (c) {
        var on = c.status === "active";
        return "<tr>" +
          '<td class="codecell">' + esc(c.code) + "</td>" +
          '<td><span class="pill ' + (on ? "pill-on" : "pill-off") + '">' +
            esc(t(on ? "statusActive" : "statusDisabled")) + "</span></td>" +
          '<td class="num">' + esc(c.claims) + "</td>" +
          '<td class="num">' + esc(c.conversions) + "</td>" +
          '<td class="num">' + esc(c.activeConversions) + "</td>" +
          '<td class="nowrap">' +
            '<button type="button" class="btn btn-ghost btn-sm" data-copy="' +
              esc(c.code) + '">' + esc(t("copyCode")) + "</button> " +
            '<button type="button" class="btn btn-ghost btn-sm" data-share="' +
              esc(c.code) + '">' + esc(t("copyShare")) + "</button>" +
          "</td>" +
        "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  /// Clipboard writes can be refused (permissions, insecure context, older
  /// Safari), so the button reports what actually happened rather than
  /// optimistically claiming success.
  async function copyText(button, text) {
    var original = button.textContent;
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = t("copied");
    } catch (e) {
      button.textContent = t("genericError");
    }
    setTimeout(function () { button.textContent = original; }, 1600);
  }

  $("codesBody").addEventListener("click", function (ev) {
    var copyBtn = ev.target.closest("button[data-copy]");
    if (copyBtn) return copyText(copyBtn, copyBtn.getAttribute("data-copy"));
    var shareBtn = ev.target.closest("button[data-share]");
    if (shareBtn) {
      copyText(shareBtn,
        t("shareTemplate").replace("{code}", shareBtn.getAttribute("data-share")));
    }
  });

  async function loadStats() {
    var res = await P.callFunction("affiliate-stats", {});
    if (!res.ok) {
      $("codesBody").innerHTML = '<div class="msg msg-error">' + esc(t("genericError")) + "</div>";
      return;
    }
    state.stats = res.data;
    renderProfile(res.data.profile);
    renderStats(res.data);
    renderEarnings(res.data);
  }

  async function route() {
    var s = await P.client.auth.getSession();
    var session = s.data.session;
    if (!session) {
      show($("authView"), true); show($("pwView"), false);
      show($("dashView"), false); show($("signOutBtn"), false);
      return;
    }
    show($("signOutBtn"), true);
    if (P.mustChangePassword(session.user)) {
      show($("authView"), false); show($("pwView"), true); show($("dashView"), false);
      return;
    }
    show($("authView"), false); show($("pwView"), false); show($("dashView"), true);
    loadStats();
  }

  $("authForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = $("signInBtn");
    btn.disabled = true; btn.textContent = t("signingIn");
    show($("authError"), false);
    var res = await P.client.auth.signInWithPassword({
      email: $("email").value.trim(), password: $("password").value,
    });
    btn.disabled = false; btn.textContent = t("signIn");
    if (res.error) {
      $("authError").textContent = t("badCredentials");
      show($("authError"), true);
      return;
    }
    $("password").value = "";
    route();
  });

  $("pwForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    show($("pwError"), false);
    var a = $("newPw").value, b = $("newPw2").value;
    if (a.length < 8) { $("pwError").textContent = t("passwordTooShort"); show($("pwError"), true); return; }
    if (a !== b) { $("pwError").textContent = t("passwordMismatch"); show($("pwError"), true); return; }

    var btn = $("pwBtn"); btn.disabled = true;
    var res = await P.client.auth.updateUser({ password: a });
    if (res.error) {
      btn.disabled = false;
      $("pwError").textContent = res.error.message || t("genericError");
      show($("pwError"), true);
      return;
    }
    await P.clearMustChangePassword();
    btn.disabled = false;
    $("newPw").value = ""; $("newPw2").value = "";
    route();
  });

  function flash(message) {
    var box = $("accountOk");
    box.textContent = message;
    show(box, true);
    setTimeout(function () { show(box, false); }, 4000);
  }

  // Changing the password later, not only when forced on first sign-in. Same
  // validation as the forced form; kept separate so the forced flow cannot be
  // skipped by scrolling past it.
  $("pwForm2").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    show($("pwError2"), false);
    var a = $("newPwA").value, b = $("newPwB").value;
    if (a.length < 8) {
      $("pwError2").textContent = t("passwordTooShort"); show($("pwError2"), true); return;
    }
    if (a !== b) {
      $("pwError2").textContent = t("passwordMismatch"); show($("pwError2"), true); return;
    }
    var btn = $("pwBtn2"); btn.disabled = true;
    var res = await P.client.auth.updateUser({ password: a });
    btn.disabled = false;
    if (res.error) {
      $("pwError2").textContent = res.error.message || t("genericError");
      show($("pwError2"), true);
      return;
    }
    $("newPwA").value = ""; $("newPwB").value = "";
    $("pwDetails").open = false;
    flash(t("passwordSaved"));
  });

  $("leaveForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    show($("leaveError"), false);
    var btn = $("leaveBtn"); btn.disabled = true;
    var res = await P.callFunction("affiliate-leave", {
      action: "request", reason: $("leaveReason").value,
    });
    btn.disabled = false;
    if (!res.ok) {
      $("leaveError").textContent = t("genericError"); show($("leaveError"), true); return;
    }
    $("leaveReason").value = "";
    flash(t("leaveSent"));
    // Re-read rather than assuming: the pending flag is server state, and the
    // request can legitimately be a no-op if one was already open.
    loadStats();
  });

  $("leaveWithdrawBtn").addEventListener("click", async function () {
    show($("leaveError"), false);
    this.disabled = true;
    var res = await P.callFunction("affiliate-leave", { action: "withdraw" });
    this.disabled = false;
    if (!res.ok) {
      $("leaveError").textContent = t("genericError"); show($("leaveError"), true); return;
    }
    if (res.data && res.data.withdrawn) flash(t("leaveWithdrawn"));
    loadStats();
  });

  $("signOutBtn").addEventListener("click", async function () {
    await P.client.auth.signOut();
    state.stats = null;
    route();
  });

  paintStatic();
  route();
})();
</script>
</body>
</html>
